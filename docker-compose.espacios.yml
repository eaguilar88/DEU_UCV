services:
  espacios-db:
    image: postgres:18
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      TZ: ${TZ:-America/Caracas}
      PGTZ: ${TZ:-America/Caracas}
    volumes:
      - espacios_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${DB_USER} -d $${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 8
    networks:
      - web

  espacios-backend:
    build:
      context: "./espacios-universitarios/backend"
      dockerfile: "Dockerfile"
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: 3000
      DB_HOST: espacios-db
      DB_PORT: 5432
      DB_DIALECT: postgres
      TZ: ${TZ:-America/Caracas}
      NODE_ENV: production
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://${APP_DOMAIN},http://${APP_DOMAIN}}
    volumes:
      - espacios_uploads:/app/uploads
    depends_on:
      espacios-db:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      # HTTP -> redirige a HTTPS
      - 'traefik.http.routers.espacios-api.rule=Host(`${APP_DOMAIN}`) && (PathPrefix(`/api`) || PathPrefix(`/uploads`))'
      - "traefik.http.routers.espacios-api.entrypoints=web"
      - "traefik.http.routers.espacios-api.middlewares=espacios-https-redirect"
      - "traefik.http.middlewares.espacios-https-redirect.redirectscheme.scheme=https"
      - "traefik.http.middlewares.espacios-https-redirect.redirectscheme.permanent=true"
      # HTTPS con certificado Let's Encrypt
      - 'traefik.http.routers.espacios-api-secure.rule=Host(`${APP_DOMAIN}`) && (PathPrefix(`/api`) || PathPrefix(`/uploads`))'
      - "traefik.http.routers.espacios-api-secure.entrypoints=websecure"
      - "traefik.http.routers.espacios-api-secure.tls.certresolver=letsencrypt"
      - "traefik.http.services.espacios-api.loadbalancer.server.port=3000"
    networks:
      - web

  espacios-frontend:
    build:
      context: "./espacios-universitarios/frontend"
      dockerfile: "Dockerfile"
      args:
        VITE_API_URL: /api
        VITE_MEDIA_BASE_URL: /
    restart: unless-stopped
    depends_on:
      - espacios-backend
    labels:
      - "traefik.enable=true"
      # HTTP -> redirige a HTTPS
      - "traefik.http.routers.espacios-web.rule=Host(`${APP_DOMAIN}`) && !PathPrefix(`/api`) && !PathPrefix(`/uploads`)"
      - "traefik.http.routers.espacios-web.entrypoints=web"
      - "traefik.http.routers.espacios-web.middlewares=espacios-https-redirect"
      # HTTPS con certificado Let's Encrypt
      - "traefik.http.routers.espacios-web-secure.rule=Host(`${APP_DOMAIN}`) && !PathPrefix(`/api`) && !PathPrefix(`/uploads`)"
      - "traefik.http.routers.espacios-web-secure.entrypoints=websecure"
      - "traefik.http.routers.espacios-web-secure.tls.certresolver=letsencrypt"
      - "traefik.http.services.espacios-web.loadbalancer.server.port=80"
    networks:
      - web

volumes:
  espacios_postgres_data:
  espacios_uploads:

networks:
  web:
    external: true
    name: deu_web
