services:
  backend:
    container_name: "backend"
    build:
      context: "./backend"
      dockerfile: "Dockerfile"
    env_file:
      - .env
    ports:
      - ${HTTP_SERVE_PORT}:${HTTP_SERVE_PORT}
    depends_on:
      db:
        condition: service_healthy
      gotenberg:
        condition: service_started
    networks:
      - web
  gotenberg:
    # Renders certificate HTML to PDF for the backend (internal/gotenberg). Not published: only
    # reachable from the backend over the web network.
    image: gotenberg/gotenberg:8
    restart: unless-stopped
    networks:
      - web
  db:
    container_name: "pg16"
    image: postgres:16-alpine
    restart: "unless-stopped"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgresql/init-schema.sql:/docker-entrypoint-initdb.d/init-schema.sql:ro
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - web
  migrate:
    image: migrate/migrate:v4.18.2
    profiles: ["tools"]
    volumes:
      - ./postgresql/migrations:/migrations
    networks:
      - web
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
networks:
  web:
    driver: bridge
volumes:
  postgres_data:
  uploads:
