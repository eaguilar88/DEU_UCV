services:
  backend:
    container_name: "backend"
    build:
      context: "./backend"
      dockerfile: "Dockerfile"
    env_file:
      - .env
    ports:
      - ${HTTP_SERVE_PORT}:${HTTP_SERVE_PORT}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - web
  db:
    container_name: "pg16"
    image: postgres:16-alpine
    restart: "unless-stopped"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgresql:/docker-entrypoint-initdb.d
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - web
networks:
  web:
    driver: bridge
volumes:
  postgres_data:
  uploads: