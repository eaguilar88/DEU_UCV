services:
  landing:
    build:
      context: "./landing"
      dockerfile: "../dockerfiles/Dockerfile.landing"
    restart: unless-stopped
    env_file:
      - .env
    environment:
      RAILS_ENV: production
      PORT: 3000
      RAILS_LOG_TO_STDOUT: "1"
      RAILS_SERVE_STATIC_FILES: "1"
      RAILS_FORCE_SSL: ${RAILS_FORCE_SSL:-false}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:${POSTGRES_PORT}/${POSTGRES_DB}
      DEU_SEED_PASSWORD: ${DEU_SEED_PASSWORD:-123123}
      DEU_SUPER_ADMIN_EMAILS: ${DEU_SUPER_ADMIN_EMAILS:-danielito.moros03@gmail.com}
    volumes:
      - landing_storage:/rails/storage
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.landing.rule=Host(`extension.ucv.ve`)"
      - "traefik.http.routers.landing.entrypoints=web"
      - "traefik.http.services.landing.loadbalancer.server.port=3000"
    networks:
      - web

volumes:
  landing_storage:

networks:
  web:
    external: true
    name: deu_web
