name: Deploy to Production
run-name: "${{ github.actor }} deploying ${{ inputs.service || github.ref_name }} to production"

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      service:
        description: "Service to deploy"
        required: true
        type: choice
        options:
          - all
          - backend
          - landing
          - diplomados
          - grupos

jobs:
  lint:
    name: Go Linters Check
    if: ${{ github.event_name == 'release' || inputs.service == 'all' || inputs.service == 'backend' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache: true
      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest
          working-directory: backend
          args: --verbose --timeout=5m

  test:
    name: Run Go Tests with Coverage
    if: ${{ github.event_name == 'release' || inputs.service == 'all' || inputs.service == 'backend' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod

      - name: Run tests
        run: |
          cd backend
          go test ./... -race -coverprofile=./coverage.tmp.out -covermode=atomic -coverpkg=./... -count=1

      - name: Install bc
        run: sudo apt update && sudo apt install bc

      - name: Check Coverage Threshold
        run: |
          cd backend
          $GITHUB_WORKSPACE/.github/workflows/gh-scripts/check-coverage.sh

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: always() && (needs.lint.result == 'success' || needs.lint.result == 'skipped') && (needs.test.result == 'success' || needs.test.result == 'skipped')
    steps:
      - name: SSH and deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          script: |
            cd /root/DEU_UCV
            git fetch --all --tags
            git checkout ${{ github.ref_name || github.sha }}
            SERVICE="${{ inputs.service || 'all' }}"
            echo "$(date -u '+%Y-%m-%dT%H:%M:%SZ') | deployed by: ${{ github.actor }} | service: $SERVICE | ref: ${{ github.ref_name || github.sha }}" >> /root/DEU_UCV/deploy.log
            if [ "$SERVICE" = "all" ]; then
              make start-prod
            else
              docker compose -f docker-compose.prod.yml up -d --build $SERVICE
            fi
