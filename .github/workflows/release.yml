name: Release

on:
  push:
    branches:
      - main

jobs:
  release:
    name: Create release if VERSION changed
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Check if VERSION changed
        id: version_check
        run: |
          if git diff --name-only HEAD~1 HEAD | grep -q "backend/cmd/deu/VERSION"; then
            VERSION=$(cat backend/cmd/deu/VERSION | tr -d '[:space:]')
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "version=$VERSION" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        if: steps.version_check.outputs.changed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version_check.outputs.version }}
          name: ${{ steps.version_check.outputs.version }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
