openapi: 3.0.0
info:
  title: DEU UCV API
  description: API del sistema de Extensión Universitaria de la UCV
  version: 1.0.0

servers:
  - url: http://localhost:8080
    description: Ambiente Local
  - url: http://51.81.78.213:8081
    description: Servidor Remoto

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Pagination:
      type: object
      properties:
        page:
          type: integer
        per_page:
          type: integer
        count:
          type: integer

    Error:
      type: object
      properties:
        message:
          type: string

    # ── Auth ──────────────────────────────────────────────────────────────────

    LoginRequest:
      type: object
      required: [ usuario, password ]
      properties:
        usuario:
          type: string
        password:
          type: string

    LoginResponse:
      type: object
      properties:
        token:
          type: string
        usuario:
          type: object
          properties:
            id:
              type: string
            nombre:
              type: string
            roles:
              type: array
              items:
                type: string
        facultad:
          type: string
        codigoProveedor:
          type: string

    # ── Users ─────────────────────────────────────────────────────────────────

    User:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        first_name:
          type: string
        last_name:
          type: string
        roles:
          type: array
          items:
            type: string
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateUserRequest:
      type: object
      required: [ email, password, first_name, last_name ]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
        first_name:
          type: string
        last_name:
          type: string

    UpdateUserRequest:
      type: object
      properties:
        first_name:
          type: string
        last_name:
          type: string

    # ── Providers ─────────────────────────────────────────────────────────────

    Provider:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        party_type:
          type: string
          enum: [ natural, juridica ]
        profit_type:
          type: string
          enum: [ lucrativo, no_lucrativo ]
        is_internal:
          type: boolean
        bio:
          type: string
        code:
          type: string
        is_active:
          type: boolean
        facultad:
          type: string
          description: Faculty the provider belongs to (faculty_enum value)
        user:
          $ref: "#/components/schemas/User"
        created_at:
          type: string
        updated_at:
          type: string

    # ── Courses ───────────────────────────────────────────────────────────────

    Course:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        objectives:
          type: string
        duration:
          type: string
        content:
          type: string
        type:
          type: string
        faculty:
          type: string
        cost:
          type: string
        location:
          type: string
        is_active:
          type: boolean
        created_at:
          type: string
        updated_at:
          type: string

    # ── Course Periods ────────────────────────────────────────────────────────

    CoursePeriod:
      type: object
      properties:
        id:
          type: string
        course_id:
          type: string
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        inscription_date:
          type: string
          format: date
        is_active:
          type: boolean
        closed_at:
          type: string
        created_at:
          type: string
        updated_at:
          type: string

    Announcement:
      type: object
      properties:
        id:
          type: string
        course_period_id:
          type: string
        title:
          type: string
        content:
          type: string
        created_at:
          type: string
        updated_at:
          type: string

    # ── Activities ────────────────────────────────────────────────────────────

    ActivityFile:
      type: object
      properties:
        id:
          type: string
        nombre:
          type: string
        url:
          type: string
        proposito:
          type: string

    Activity:
      type: object
      properties:
        id:
          type: string
        group_id:
          type: string
        nombre:
          type: string
        descripcion:
          type: string
        fecha:
          type: string
        area_conocimiento:
          type: string
        aliados:
          type: string
        participantes_estimados:
          type: integer
        participantes_reales:
          type: integer
        financiamiento:
          type: string
        observaciones:
          type: string
        archivos:
          type: array
          items:
            $ref: "#/components/schemas/ActivityFile"
        creado_en:
          type: string
          format: date-time
        actualizado_en:
          type: string
          format: date-time

    # ── Groups ────────────────────────────────────────────────────────────────

    Group:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        faculty:
          type: string
        objective:
          type: string
        location:
          type: string
        is_active:
          type: boolean
        owner:
          $ref: "#/components/schemas/User"
        created_at:
          type: string
        updated_at:
          type: string

    # ── Group Resource Requests ───────────────────────────────────────────────

    GroupResourceRequest:
      type: object
      properties:
        id:
          type: string
        grupo_id:
          type: string
        tipo:
          type: string
        contenido:
          type: string
        estado:
          $ref: "#/components/schemas/RequestStatus"
        creado_en:
          type: string
          format: date-time
        actualizado_en:
          type: string
          format: date-time

    CreateGroupResourceRequestBody:
      type: object
      required: [ grupo_id, tipo ]
      properties:
        grupo_id:
          type: string
        tipo:
          type: string
        contenido:
          type: string

    # ── Request status ────────────────────────────────────────────────────────

    RequestStatus:
      type: string
      enum: [ created, under_review, approved, rejected, redirected ]

    # ── Course Requests ───────────────────────────────────────────────────────

    CourseRequest:
      type: object
      properties:
        id:
          type: string
        status:
          $ref: "#/components/schemas/RequestStatus"
        comments:
          type: string
        reviewed_at:
          type: string
        created_at:
          type: string
        updated_at:
          type: string
        course:
          $ref: "#/components/schemas/Course"

    ApproveCourseRequestBody:
      type: object
      properties:
        tipo_curso:
          type: string
        observaciones:
          type: string

    RejectRequestBody:
      type: object
      properties:
        observaciones:
          type: string

    RedirectCourseRequestBody:
      type: object
      required: [ facultad, motivo ]
      properties:
        facultad:
          type: string
        motivo:
          type: string

    # ── Group Requests ────────────────────────────────────────────────────────

    ApprovalItem:
      type: object
      properties:
        id:
          type: string
        facultad:
          type: string
        estado:
          $ref: "#/components/schemas/RequestStatus"
        revisado_en:
          type: string
          format: date-time

    GroupRequest:
      type: object
      properties:
        id:
          type: string
        grupo_id:
          type: string
        estado:
          $ref: "#/components/schemas/RequestStatus"
        facultad:
          type: string
        comentarios:
          type: string
        aprobaciones:
          type: array
          items:
            $ref: "#/components/schemas/ApprovalItem"
        creado_en:
          type: string
        actualizado_en:
          type: string

    # ── Provider Requests ─────────────────────────────────────────────────────

    ProviderRequest:
      type: object
      properties:
        id:
          type: string
        provider_id:
          type: string
        status:
          $ref: "#/components/schemas/RequestStatus"
        comments:
          type: string
        reviewed_at:
          type: string
        created_at:
          type: string
        updated_at:
          type: string

    # ── Course Cycle Close Requests ───────────────────────────────────────────

    CloseRequest:
      type: object
      properties:
        id:
          type: string
        course_cycle_id:
          type: string
        submitted_by_id:
          type: string
        status:
          $ref: "#/components/schemas/RequestStatus"
        comments:
          type: string
        reviewed_at:
          type: string
        created_at:
          type: string
        updated_at:
          type: string

paths:

  # ── Health / Version ──────────────────────────────────────────────────────

  /health:
    get:
      summary: Health check
      tags: [ System ]
      responses:
        "200":
          description: Service is healthy

  /version:
    get:
      summary: Get API version
      tags: [ System ]
      responses:
        "200":
          description: Current version
          content:
            application/json:
              schema:
                type: object
                properties:
                  version:
                    type: string

  /files/{key}:
    get:
      summary: Download a file
      tags: [ Files ]
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: File content

  # ── Auth ──────────────────────────────────────────────────────────────────

  /auth/login:
    post:
      summary: Login
      tags: [ Auth ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: JWT token + user info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          description: Invalid credentials

  # ── Users ─────────────────────────────────────────────────────────────────

  /users:
    get:
      summary: List users
      tags: [ Users ]
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            default: 10
      responses:
        "200":
          description: Paginated user list
        "401":
          description: Unauthorized
    post:
      summary: Create user
      tags: [ Users ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "201":
          description: User created
        "409":
          description: Email already in use

  /users/{id}:
    get:
      summary: Get user by ID
      tags: [ Users ]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: User
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          description: User not found
    put:
      summary: Update user
      tags: [ Users ]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
      responses:
        "200":
          description: Updated user
        "404":
          description: User not found
    delete:
      summary: Delete user
      tags: [ Users ]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted
        "404":
          description: User not found

  # ── Providers ─────────────────────────────────────────────────────────────

  /providers:
    get:
      summary: List providers
      tags: [ Providers ]
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
        - name: per_page
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Paginated provider list
    post:
      summary: Create provider
      tags: [ Providers ]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [ tipo_proveedor, tipo_persona, tipo_lucro, ci, rif, islr, logo ]
              properties:
                tipo_proveedor:
                  type: string
                  enum: [ courses, groups ]
                tipo_persona:
                  type: string
                  enum: [ natural, juridical ]
                tipo_lucro:
                  type: string
                  enum: [ lucrativo, no_lucrativo ]
                nombre:
                  type: string
                bio:
                  type: string
                es_interno:
                  type: string
                  enum: [ "true", "false" ]
                facultad:
                  type: string
                  description: faculty_enum value (e.g. Ingeniería, Medicina, DEU)
                ci:
                  type: string
                  format: binary
                rif:
                  type: string
                  format: binary
                islr:
                  type: string
                  format: binary
                logo:
                  type: string
                  format: binary
                resumes:
                  type: array
                  items:
                    type: string
                    format: binary
                  description: At least one resume file is required
                others:
                  type: array
                  items:
                    type: string
                    format: binary
      responses:
        "201":
          description: Provider created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
        "400":
          description: Missing or invalid fields
        "401":
          description: Unauthorized
        "409":
          description: Duplicate entry

  /providers/documents:
    post:
      summary: Upload provider documents
      description: >
        Upload an intention letter and/or commitment letter for the authenticated provider.
        The commitment letter is required; the intention letter is optional if one already exists in the database.
        Each commitment letter upload is versioned automatically (v1, v2, …).
        After upload, all courses for this provider created since the previous commitment letter are marked as has_documentation=true.
      tags: [ Providers ]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [ carta_compromiso ]
              properties:
                carta_compromiso:
                  type: string
                  format: binary
                  description: Commitment letter (required). Versioned automatically.
                carta_intencion:
                  type: string
                  format: binary
                  description: Intention letter (required only if none exists in the database yet).
      responses:
        "201":
          description: Documents uploaded and courses marked
        "400":
          description: carta_compromiso missing, or no intention letter on file and none provided
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized
        "404":
          description: Provider not found for the authenticated user

  /providers/{id}:
    get:
      summary: Get provider by ID
      tags: [ Providers ]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Provider
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Provider"
        "404":
          description: Provider not found
    put:
      summary: Update provider
      tags: [ Providers ]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Updated
        "404":
          description: Provider not found
    delete:
      summary: Delete provider
      tags: [ Providers ]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted
        "404":
          description: Provider not found

  # ── Courses ───────────────────────────────────────────────────────────────

  /courses:
    get:
      summary: List courses
      tags: [ Courses ]
      parameters:
        - name: page
          in: query
          schema:
            type: integer
        - name: per_page
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Paginated course list
    post:
      summary: Create course
      tags: [ Courses ]
      security:
        - BearerAuth: []
      responses:
        "201":
          description: Course created

  /courses/{id}:
    get:
      summary: Get course by ID
      tags: [ Courses ]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Course
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Course"
        "404":
          description: Course not found
    put:
      summary: Update course
      tags: [ Courses ]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Updated
        "404":
          description: Course not found
    delete:
      summary: Delete course
      tags: [ Courses ]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted
        "404":
          description: Course not found

  # ── Course Periods ────────────────────────────────────────────────────────

  /courses/{course_id}/periods:
    get:
      summary: List periods for a course
      tags: [ Course Periods ]
      parameters:
        - name: course_id
          in: path
          required: true
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
        - name: per_page
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Paginated period list
    post:
      summary: Create a course period
      tags: [ Course Periods ]
      security:
        - BearerAuth: []
      parameters:
        - name: course_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "201":
          description: Period created

  /courses/{course_id}/periods/{id}:
    get:
      summary: Get a course period by ID
      tags: [ Course Periods ]
      parameters:
        - name: course_id
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Course period
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoursePeriod"
        "404":
          description: Period not found
    put:
      summary: Update a course period
      tags: [ Course Periods ]
      security:
        - BearerAuth: []
      parameters:
        - name: course_id
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Updated
        "404":
          description: Period not found
    delete:
      summary: Delete a course period
      tags: [ Course Periods ]
      security:
        - BearerAuth: []
      parameters:
        - name: course_id
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted
        "404":
          description: Period not found

  # ── Announcements ─────────────────────────────────────────────────────────

  /course-periods/{period_id}/announcements/{id}:
    get:
      summary: Get announcement by ID
      tags: [ Announcements ]
      parameters:
        - name: period_id
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Announcement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Announcement"
        "404":
          description: Announcement not found
    put:
      summary: Update announcement
      tags: [ Announcements ]
      security:
        - BearerAuth: []
      parameters:
        - name: period_id
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Updated
        "404":
          description: Announcement not found
    delete:
      summary: Delete announcement
      tags: [ Announcements ]
      security:
        - BearerAuth: []
      parameters:
        - name: period_id
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted
        "404":
          description: Announcement not found

  /course-periods/{period_id}/announcements:
    post:
      summary: Create announcement
      tags: [ Announcements ]
      security:
        - BearerAuth: []
      parameters:
        - name: period_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [ title, content ]
              properties:
                title:
                  type: string
                content:
                  type: string
      responses:
        "201":
          description: Announcement created

  # ── Activities ────────────────────────────────────────────────────────────

  /activities:
    get:
      summary: List activities
      tags: [ Activities ]
      parameters:
        - name: group_id
          in: query
          required: true
          schema:
            type: string
        - name: date
          in: query
          schema:
            type: string
        - name: actual_participants
          in: query
          schema:
            type: integer
        - name: page
          in: query
          required: true
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          required: true
          schema:
            type: integer
            default: 10
      responses:
        "200":
          description: Paginated activity list
          content:
            application/json:
              schema:
                type: object
                properties:
                  actividades:
                    type: array
                    items:
                      $ref: "#/components/schemas/Activity"
                  pagina:
                    $ref: "#/components/schemas/Pagination"
        "400":
          description: Missing required query parameters
    post:
      summary: Create activity
      tags: [ Activities ]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [ group_id, nombre ]
              properties:
                group_id:
                  type: string
                nombre:
                  type: string
                descripcion:
                  type: string
                fecha:
                  type: string
                area_conocimiento:
                  type: string
                aliados:
                  type: string
                participantes_estimados:
                  type: integer
                participantes_reales:
                  type: integer
                financiamiento:
                  type: string
                observaciones:
                  type: string
                reporte:
                  type: array
                  items:
                    type: string
                    format: binary
                  description: Optional report files
      responses:
        "201":
          description: Activity created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
        "400":
          description: Validation error
        "401":
          description: Unauthorized

  /activities/{id}:
    get:
      summary: Get activity by ID
      tags: [ Activities ]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Activity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Activity"
        "404":
          description: Activity not found
    put:
      summary: Update activity
      tags: [ Activities ]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                nombre:
                  type: string
                descripcion:
