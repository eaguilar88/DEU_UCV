      summary: Approve a course cycle close request
      description: >
        Closes the cycle and queues the generation of the participants' certificates. A
        background job renders them and emails the submitter the verification links and a ZIP.
      tags: [Admin - Course Cycle Close Requests]
      security:
        - BearerAuth: []
