services:
  traefik:
    image: traefik:latest
    restart: unless-stopped
    command:
      - "--api.dashboard=true" # Enable the dashboard
      - "--api.insecure=true" # Allow insecure dashboard (for local testing)
      - "--providers.docker=true" # Enable Docker provider
      - "--providers.docker.exposedbydefault=false" # Don't expose containers by default
      - "--entrypoints.web.address=:80" # Define entrypoint for HTTP
      - "--entrypoints.websecure.address=:443" # Enable HTTPS
      - "--log.level=DEBUG" # Set log level to warn
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.letsencrypt.acme.email=danielito.moros03@gmail.com"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
    ports:
      - "80:80" # Expose HTTP
      - "443:443" # Expose HTTPS
      - "8080:8080" # Expose Traefik dashboard (optional)
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro" # Allow Traefik to talk to Docker
      - "letsencrypt:/letsencrypt"
    networks:
      - web
  diplomados:
    build:
      context: "./diplomados"
      dockerfile: "Dockerfile"
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.formacion.rule=Host(`formacion.extension.ucv.ve`)"
      - "traefik.http.routers.formacion.entrypoints=web"
      - "traefik.http.routers.formacion.middlewares=formacion-https-redirect"
      - "traefik.http.middlewares.formacion-https-redirect.redirectscheme.scheme=https"
      - "traefik.http.middlewares.formacion-https-redirect.redirectscheme.permanent=true"
      - "traefik.http.routers.formacion-secure.rule=Host(`formacion.extension.ucv.ve`)"
      - "traefik.http.routers.formacion-secure.entrypoints=websecure"
      - "traefik.http.routers.formacion-secure.tls.certresolver=letsencrypt"
      - "traefik.http.services.formacion.loadbalancer.server.port=3000"
    networks:
      - web
  grupos:
    build:
      context: "./grupos"
      dockerfile: "Dockerfile"
    restart: unless-stopped
    depends_on:
      - backend
      - db
    environment:
      - INTERNAL_API_URL=http://backend:8081
      - NEXT_PUBLIC_API_URL=/api/proxy
      - CHROMIUM_EXECUTABLE_PATH=/usr/bin/chromium-browser
    volumes:
      - ./grupos/src/data:/app/src/data
    labels:
      - "traefik.enable=true" # Enable Traefik for this service
      - "traefik.http.routers.grupos.rule=Host(`grupos.extension.ucv.ve`)" # Route based on hostname
      - "traefik.http.routers.grupos.entrypoints=web" # Use the web entrypoint
      - "traefik.http.routers.grupos.middlewares=grupos-https-redirect"
      - "traefik.http.middlewares.grupos-https-redirect.redirectscheme.scheme=https"
      - "traefik.http.middlewares.grupos-https-redirect.redirectscheme.permanent=true"
      - "traefik.http.routers.grupos-secure.rule=Host(`grupos.extension.ucv.ve`)"
      - "traefik.http.routers.grupos-secure.entrypoints=websecure"
      - "traefik.http.routers.grupos-secure.tls.certresolver=letsencrypt"
      - "traefik.http.services.grupos.loadbalancer.server.port=3000" # Target container's port
    networks:
      - web
  backend:
    build:
      context: "./backend"
      dockerfile: "Dockerfile"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      gotenberg:
        condition: service_started
    ports:
      - ${HTTP_SERVE_PORT}:${HTTP_SERVE_PORT}
    env_file:
      - .env
    secrets:
      - b2_key_id
      - b2_application_key
    links:
      - "db"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=Host(`api.extension.ucv.ve`)"
      - "traefik.http.routers.backend.entrypoints=web" # Use the web entrypoint
      - "traefik.http.routers.backend.service=backend"
      - "traefik.http.routers.backend.middlewares=backend-https-redirect"
      - "traefik.http.middlewares.backend-https-redirect.redirectscheme.scheme=https"
      - "traefik.http.middlewares.backend-https-redirect.redirectscheme.permanent=true"
      - "traefik.http.routers.backend-secure.rule=Host(`api.extension.ucv.ve`)"
      - "traefik.http.routers.backend-secure.entrypoints=websecure"
      - "traefik.http.routers.backend-secure.tls.certresolver=letsencrypt"
      - "traefik.http.routers.backend-secure.service=backend"
      # Archivos de B2 servidos desde el dominio principal (solo /files -> backend, el resto sigue en landing)
      - "traefik.http.routers.backend-files.rule=Host(`extension.ucv.ve`) && PathPrefix(`/files`)"
      - "traefik.http.routers.backend-files.entrypoints=websecure"
      - "traefik.http.routers.backend-files.tls.certresolver=letsencrypt"
      - "traefik.http.routers.backend-files.priority=100"
      - "traefik.http.routers.backend-files.service=backend"
      # Páginas públicas de verificación de certificados (enlaces de los códigos QR)
      - "traefik.http.routers.backend-certificates.rule=Host(`extension.ucv.ve`) && PathPrefix(`/certificados`)"
      - "traefik.http.routers.backend-certificates.entrypoints=websecure"
      - "traefik.http.routers.backend-certificates.tls.certresolver=letsencrypt"
      - "traefik.http.routers.backend-certificates.priority=100"
      - "traefik.http.routers.backend-certificates.service=backend"
      - "traefik.http.services.backend.loadbalancer.server.port=8081" # Target container's port
    networks:
      - web
  notifier:
    # Sends the reminder emails (cmd/notifier) once on start and then daily at NOTIFIER_RUN_AT.
    # Same image as the backend, different entrypoint.
    build:
      context: "./backend"
      dockerfile: "Dockerfile"
    entrypoint: ["./notifier"]
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - web
  gotenberg:
    # Renders certificate HTML to PDF for the backend (internal/gotenberg). Not published: only
    # reachable from the backend over the web network.
    image: gotenberg/gotenberg:8
    restart: unless-stopped
    networks:
      - web
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgresql/init-schema.sql:/docker-entrypoint-initdb.d/init-schema.sql:ro
    env_file:
      - .env
    networks:
      - web
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
  migrate:
    image: migrate/migrate:v4.18.2
    profiles: ["tools"]
    volumes:
      - ./postgresql/migrations:/migrations
    networks:
      - web
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
volumes:
  postgres_data:
  letsencrypt:
networks:
  web:
    driver: bridge
    name: deu_web
secrets:
  b2_key_id:
    file: ./secrets/b2_key_id
  b2_application_key:
    file: ./secrets/b2_application_key
